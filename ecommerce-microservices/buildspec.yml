version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - cd ecommerce-microservices || true
      - mkdir -p /tmp/go-cache
      - go version
  pre_build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - go mod download
      - go test -race ./tests/...
  build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - mkdir -p bin
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/gateway ./gateway/main.go
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/order-service ./services/order/main.go
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/product-service ./services/product/main.go
      - chmod +x bin/gateway bin/order-service bin/product-service
artifacts:
  base-directory: ecommerce-microservices
  files:
    - bin/gateway
    - bin/order-service
    - bin/product-service
    - Procfile
    - schema.sql