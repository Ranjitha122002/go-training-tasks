version: 0.2

phases:
  install:
    commands:
      - echo "Navigating to microservices directory..."
      - cd ecommerce-microservices || true
      - mkdir -p /tmp/go-cache
      - go version
  pre_build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - go mod download
      - echo "Running unit tests with race detection..."
      - go test -race ./tests/...
  build:
    commands:
      - cd ecommerce-microservices || true
      - export GOCACHE=/tmp/go-cache
      - echo "Compiling microservices..."
      - mkdir -p bin
      - GOOS=linux GOARCH=amd64 go build -o bin/gateway ./gateway/main.go
      - GOOS=linux GOARCH=amd64 go build -o bin/order-service ./services/order/main.go
      - GOOS=linux GOARCH=amd64 go build -o bin/product-service ./services/product/main.go

artifacts:
  base-directory: ecommerce-microservices
  files:
    - bin/gateway
    - bin/order-service
    - bin/product-service
    - Procfile
    - go.mod
    - go.sum
    - schema.sql
